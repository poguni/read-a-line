<!doctype html>
<html lang="ko" data-theme="library">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>한 줄 독서</title>
<meta name="description" content="연간 독서 목표를 빙고판과 미션으로 바꿔 주는 독서 챌린지 앱">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,600&family=Fredoka:wght@500;600;700&family=Gowun+Dodum&family=Jua&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Inter+Tight:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* ===================== 테마 토큰 ===================== */
:root,[data-theme="library"]{
  --bg:#efe5cf;--bg-image:none;--surface:#f8f1e0;--surface-2:#e9dcc0;--ink:#2a2118;--muted:#5c4a38;--line:#d9c49a;--line-strong:#8a7357;
  --primary:#6e2230;--primary-ink:#f8ecd2;--accent:#24412f;--accent-ink:#f3ead4;--accent-text:#6e2230;--focus:#a97c35;
  --radius:6px;--radius-sm:4px;--btn-radius:4px;--card-border:1px solid #c9a35c;--card-shadow:inset 0 0 0 4px #f8f1e0,inset 0 0 0 5px #e3d2ab;
  --btn-border:1px solid #c9a35c;--btn-shadow:inset 0 0 0 2px #6e2230,inset 0 0 0 3px #c9a35c;--ghost-border:1px solid #8a7357;--ghost-shadow:none;--ghost-bg:#f8f1e0;
  --font-display:'Gowun Dodum',sans-serif;--font-body:'Gowun Dodum',sans-serif;--font-num:'Gowun Dodum',sans-serif;--font-latin:'Cormorant Garamond',serif;--display-weight:700;--latin-style:italic;
  --side-bg:#24412f;--side-ink:#f3ead4;--side-muted:#d4c7a8;--side-active-bg:#2f5240;--side-active-ink:#f3d99a;--side-border:4px double #c9a35c;
  --top-bg:#24412f;--top-ink:#f3ead4;--top-border:4px double #c9a35c;
  --nav-bg:#24412f;--nav-ink:#d8ccb2;--nav-active:#f3d99a;--nav-active-bg:transparent;--nav-border:2px solid #c9a35c;
  --sum-bg:#24412f;--sum-ink:#f3ead4;--sum-muted:#e1d4b8;--sum-track:#3b5a47;--sum-fill:#d9bf8a;--sum-border:1px solid #c9a35c;--sum-today:#f8ecd2;
  --track:#e3d5b5;--fill:#24412f;--time:#8a7357;
  --cell-empty:#f8f1e0;--cell-empty-ink:#4a3a29;--cell-empty-border:1px dashed #8a7357;--c-empty-stroke:#8a7357;
  --cell-filled:#24412f;--cell-filled-ink:#f3ead4;--cell-filled-border:1px solid #3b5a47;--c-filled-stroke:#3b5a47;
  --cell-bingo:#6e2230;--cell-bingo-ink:#f8ecd2;--cell-bingo-border:2px solid #d9bf8a;--c-bingo-stroke:#d9bf8a;
  --cell-free:#a97c35;--cell-free-ink:#2a2118;--cell-free-border:1px solid #d9bf8a;--c-free-stroke:#d9bf8a;
  --cell-radius:3px;--cell-shadow:none;--board-frame:#5a3d26;--board-pad:10px;--board-shadow:inset 0 0 0 1px #c9a35c;
  --line-stroke:#f3d99a;--line-w:5;
  --good:#2f6b3f;--warn:#b7791f;--bad:#9b2c2c;
  --img-head:#24412f;--img-head-ink:#f3ead4;
  --confetti:#d9bf8a,#6e2230,#24412f,#f3ead4,#a97c35;
  --icon-w:1.6;--logo-a:#d9bf8a;--logo-b:#b8475a;--logo-off:rgba(243,234,212,.22);
  --size-active-bg:#24412f;--size-active-ink:#f3ead4;--size-active-border:#c9a35c;
  --chip-bg:#e9dcc0;--chip-ink:#2a2118;
}
[data-theme="pop"]{
  --bg:#fff4e2;--bg-image:radial-gradient(#f0d6ad 1.3px,transparent 1.3px);--surface:#ffffff;--surface-2:#fff4e2;--ink:#2b2433;--muted:#5b5266;--line:#2b2433;--line-strong:#2b2433;
  --primary:#ff6b5b;--primary-ink:#2b2433;--accent:#ffd84d;--accent-ink:#2b2433;--accent-text:#2b2433;--focus:#2f6bff;
  --radius:22px;--radius-sm:16px;--btn-radius:999px;--card-border:2.5px solid #2b2433;--card-shadow:0 4px 0 #2b2433;
  --btn-border:2.5px solid #2b2433;--btn-shadow:0 4px 0 #2b2433;--ghost-border:2.5px solid #2b2433;--ghost-shadow:0 3px 0 #2b2433;--ghost-bg:#ffffff;
  --font-display:'Jua',sans-serif;--font-body:'Gowun Dodum',sans-serif;--font-num:'Fredoka',sans-serif;--font-latin:'Fredoka',sans-serif;--display-weight:400;--latin-style:normal;
  --side-bg:#ffffff;--side-ink:#2b2433;--side-muted:#5b5266;--side-active-bg:#ffd84d;--side-active-ink:#2b2433;--side-border:2.5px solid #2b2433;
  --top-bg:transparent;--top-ink:#2b2433;--top-border:none;
  --nav-bg:#ffffff;--nav-ink:#2b2433;--nav-active:#2b2433;--nav-active-bg:#ffd84d;--nav-border:2.5px solid #2b2433;
  --sum-bg:#ffffff;--sum-ink:#2b2433;--sum-muted:#5b5266;--sum-track:#fff4e2;--sum-fill:#ffd84d;--sum-border:2.5px solid #2b2433;--sum-today:#2b2433;
  --track:#ffffff;--fill:#ff6b5b;--time:#b9a3ff;
  --cell-empty:#ffffff;--cell-empty-ink:#2b2433;--cell-empty-border:2px solid #2b2433;--c-empty-stroke:#2b2433;
  --cell-filled:#ffd84d;--cell-filled-ink:#2b2433;--cell-filled-border:2px solid #2b2433;--c-filled-stroke:#2b2433;
  --cell-bingo:#4fd1b0;--cell-bingo-ink:#2b2433;--cell-bingo-border:2px solid #2b2433;--c-bingo-stroke:#2b2433;
  --cell-free:#ff6b5b;--cell-free-ink:#2b2433;--cell-free-border:2px solid #2b2433;--c-free-stroke:#2b2433;
  --cell-radius:14px;--cell-shadow:0 3px 0 #2b2433;--board-frame:transparent;--board-pad:0px;--board-shadow:none;
  --line-stroke:#2b2433;--line-w:4;
  --good:#1f8a6b;--warn:#e0a100;--bad:#e5484d;
  --img-head:#ffd84d;--img-head-ink:#2b2433;
  --confetti:#ff6b5b,#ffd84d,#4fd1b0,#b9a3ff,#2b2433;
  --icon-w:2.2;--logo-a:#ff6b5b;--logo-b:#4fd1b0;--logo-off:#f3dcb8;
  --size-active-bg:#ff6b5b;--size-active-ink:#2b2433;--size-active-border:#2b2433;
  --chip-bg:#fff4e2;--chip-ink:#2b2433;
}
[data-theme="modern"]{
  --bg:#f4f3ef;--bg-image:none;--surface:#ffffff;--surface-2:#eceae4;--ink:#121417;--muted:#5f636b;--line:#e6e4de;--line-strong:#cfccc4;
  --primary:#121417;--primary-ink:#ffffff;--accent:#3550e6;--accent-ink:#ffffff;--accent-text:#2c43c4;--focus:#3550e6;
  --radius:16px;--radius-sm:12px;--btn-radius:12px;--card-border:1px solid #e6e4de;--card-shadow:none;
  --btn-border:1px solid #121417;--btn-shadow:none;--ghost-border:1px solid #dcdad4;--ghost-shadow:none;--ghost-bg:#ffffff;
  --font-display:'IBM Plex Sans KR',sans-serif;--font-body:'IBM Plex Sans KR',sans-serif;--font-num:'Inter Tight',sans-serif;--font-latin:'Inter Tight',sans-serif;--display-weight:700;--latin-style:normal;
  --side-bg:#ffffff;--side-ink:#121417;--side-muted:#5f636b;--side-active-bg:#eef0fd;--side-active-ink:#2c43c4;--side-border:1px solid #e6e4de;
  --top-bg:transparent;--top-ink:#121417;--top-border:none;
  --nav-bg:#ffffff;--nav-ink:#5f636b;--nav-active:#2c43c4;--nav-active-bg:transparent;--nav-border:1px solid #dcdad4;
  --sum-bg:#ffffff;--sum-ink:#121417;--sum-muted:#5f636b;--sum-track:#e3e1db;--sum-fill:#121417;--sum-border:1px solid #e6e4de;--sum-today:#3550e6;
  --track:#e3e1db;--fill:#121417;--time:#3550e6;
  --cell-empty:#ffffff;--cell-empty-ink:#4a4e55;--cell-empty-border:1px solid #dcdad4;--c-empty-stroke:#dcdad4;
  --cell-filled:#121417;--cell-filled-ink:#ffffff;--cell-filled-border:1px solid #121417;--c-filled-stroke:#121417;
  --cell-bingo:#3550e6;--cell-bingo-ink:#ffffff;--cell-bingo-border:1px solid #3550e6;--c-bingo-stroke:#3550e6;
  --cell-free:#e6e4de;--cell-free-ink:#121417;--cell-free-border:1px solid #e6e4de;--c-free-stroke:#e6e4de;
  --cell-radius:10px;--cell-shadow:none;--board-frame:transparent;--board-pad:0px;--board-shadow:none;
  --line-stroke:#ffffff;--line-w:3;
  --good:#1f7a4d;--warn:#e08a00;--bad:#d64545;
  --img-head:#121417;--img-head-ink:#ffffff;
  --confetti:#3550e6,#121417,#9aa8ff,#e08a00;
  --icon-w:1.7;--logo-a:#121417;--logo-b:#3550e6;--logo-off:#dcdad4;
  --size-active-bg:#ffffff;--size-active-ink:#121417;--size-active-border:transparent;
  --chip-bg:#eceae4;--chip-ink:#121417;
}

/* ===================== 기본 ===================== */
*{box-sizing:border-box}
html,body{margin:0}
body{background-color:var(--bg);background-image:var(--bg-image);background-size:18px 18px;color:var(--ink);font-family:var(--font-body);line-height:1.55;word-break:keep-all;overflow-wrap:anywhere;-webkit-font-smoothing:antialiased;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
h1,h2,h3{font-family:var(--font-display);font-weight:var(--display-weight);margin:0;line-height:1.3}
p{margin:0}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ico{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:var(--icon-w);stroke-linecap:round;stroke-linejoin:round}
.muted{color:var(--muted)}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums}
.latin{font-family:var(--font-latin);font-style:var(--latin-style);letter-spacing:.06em}
.spacer{flex:1}
@media (max-width:1023.98px){.d-only{display:none!important}}
@media (min-width:1024px){.m-only{display:none!important}}

/* ===================== 레이아웃 ===================== */
.shell{min-height:100vh;display:flex;flex-direction:column}
.sidebar{display:none}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 8px 10px 16px;background:var(--top-bg);color:var(--top-ink);border-bottom:var(--top-border)}
.main{flex:1;width:100%;max-width:680px;margin:0 auto;padding:16px 16px calc(96px + env(safe-area-inset-bottom))}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2px;padding:6px 6px calc(8px + env(safe-area-inset-bottom));background:var(--nav-bg);border-top:var(--nav-border)}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;min-height:52px;justify-content:center;border:2px solid transparent;border-radius:var(--radius-sm);background:none;color:var(--nav-ink);font-size:12px}
.tab .ico{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--nav-active);background:var(--nav-active-bg);font-weight:700}
[data-theme="pop"] .tab{font-family:var(--font-display);font-size:13px}
[data-theme="pop"] .tab[aria-current="page"]{border-color:#2b2433}

.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{display:grid;grid-template-columns:repeat(3,8px);gap:2.5px;flex:none}
.logo i{width:8px;height:8px;border-radius:2px;background:var(--logo-off)}
.logo i.a{background:var(--logo-a)}.logo i.b{background:var(--logo-b)}
[data-theme="pop"] .logo i{border-radius:50%}
.brand-text{display:flex;flex-direction:column;line-height:1.2;min-width:0}
.brand-ko{font-family:var(--font-display);font-weight:var(--display-weight);font-size:21px}
.brand-en{font-family:var(--font-latin);font-style:var(--latin-style);font-size:12px;letter-spacing:.1em;opacity:.85}
.icon-btn{width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;border:none;background:transparent;color:inherit;border-radius:var(--radius-sm)}
.icon-btn:hover{background:color-mix(in srgb,currentColor 10%,transparent)}

@media (min-width:1024px){
  .shell{display:grid;grid-template-columns:256px minmax(0,1fr)}
  .topbar,.tabbar{display:none}
  .sidebar{display:flex;flex-direction:column;gap:28px;position:sticky;top:0;height:100vh;overflow:auto;padding:28px 18px 22px;background:var(--side-bg);color:var(--side-ink);border-right:var(--side-border)}
  .main{max-width:none;margin:0;padding:28px 36px 36px}
  .sidebar .brand-ko{font-size:24px}
}
.side-nav{display:flex;flex-direction:column;gap:4px}
.side-link{display:flex;align-items:center;gap:12px;min-height:46px;padding:0 14px;border:2px solid transparent;border-radius:var(--radius-sm);background:none;color:var(--side-ink);font-size:15px;text-align:left}
.side-link:hover{background:color-mix(in srgb,var(--side-active-bg) 60%,transparent)}
.side-link[aria-current="page"]{background:var(--side-active-bg);color:var(--side-active-ink);font-weight:700}
[data-theme="pop"] .side-link{font-family:var(--font-display);font-size:17px}
[data-theme="pop"] .side-link[aria-current="page"]{border-color:#2b2433;box-shadow:0 3px 0 #2b2433}
[data-theme="library"] .side-link{font-family:var(--font-display);font-weight:700}
.side-sec{display:flex;flex-direction:column;gap:10px}
.side-title{font-size:12px;letter-spacing:.08em;color:var(--side-muted)}
.theme-dots{display:flex;gap:8px}
.theme-dot{flex:1;min-height:44px;border-radius:var(--radius-sm);border:2px solid transparent;display:flex;align-items:center;justify-content:center;gap:3px;background:rgba(127,127,127,.12);color:var(--side-ink);font-size:12px;padding:4px}
.theme-dot[aria-pressed="true"]{border-color:currentColor;font-weight:700}
.theme-dot .sw{width:12px;height:12px;border-radius:3px}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;font-size:13px;color:var(--side-muted)}
.side-foot b{color:var(--side-ink)}
.mini-track{height:6px;border-radius:3px;background:rgba(127,127,127,.25);overflow:hidden}
.mini-track i{display:block;height:100%;background:var(--sum-fill)}
[data-theme="library"] .mini-track i{background:#d9bf8a}

/* ===================== 공통 컴포넌트 ===================== */
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.page-head h1{font-size:24px}
.eyebrow{font-family:var(--font-latin);font-style:var(--latin-style);font-size:13px;letter-spacing:.1em;color:var(--muted);margin-bottom:2px}
.head-actions{display:flex;gap:10px;flex-wrap:wrap}
@media (min-width:1024px){.page-head{margin-bottom:22px}.page-head h1{font-size:30px}}
[data-theme="library"] .page-head h1{color:#24412f}

.card{background:var(--surface);border:var(--card-border);box-shadow:var(--card-shadow);border-radius:var(--radius);padding:18px}
.card h2{font-size:17px;margin-bottom:10px}
[data-theme="library"] .card h2{color:#24412f}
.card-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}
.card-head h2{margin:0}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:var(--btn-radius);border:var(--ghost-border);background:var(--ghost-bg);color:var(--ink);box-shadow:var(--ghost-shadow);font-weight:600;font-size:15px;text-decoration:none;white-space:nowrap;transition:transform .1s,box-shadow .1s}
.btn.primary{background:var(--primary);color:var(--primary-ink);border:var(--btn-border);box-shadow:var(--btn-shadow)}
.btn.big{min-height:52px;font-size:16px;padding:0 22px}
.btn.sm{min-height:38px;padding:0 12px;font-size:14px}
.btn.block{width:100%}
.btn.danger{color:var(--bad);border-color:currentColor}
[data-theme="pop"] .btn{font-family:var(--font-display);font-weight:400;font-size:16px}
[data-theme="pop"] .btn:active{transform:translateY(3px);box-shadow:0 1px 0 #2b2433}
[data-theme="library"] .btn{font-family:var(--font-display);font-weight:800}
[data-theme="modern"] .btn:hover{border-color:#121417}
[data-theme="modern"] .btn.primary:hover{background:#2a2d33}

.field{display:flex;flex-direction:column;gap:6px;font-size:14px}
.field>span{font-weight:600}
.input,.field input,.field select,.field textarea{min-height:44px;padding:10px 12px;border-radius:var(--radius-sm);border:var(--ghost-border);background:var(--surface);color:var(--ink);width:100%}
.field textarea{min-height:76px;resize:vertical}
[data-theme="library"] .field input,[data-theme="library"] .field textarea,[data-theme="library"] .input{border-style:solid;background:#fffaf0}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.check{display:flex;align-items:center;gap:10px;min-height:44px;font-size:15px}
.check input{width:22px;height:22px;accent-color:var(--accent)}
.err{color:var(--bad);font-size:13px;min-height:1em}

.chip{display:inline-flex;align-items:center;min-height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line-strong);background:var(--chip-bg);color:var(--chip-ink);font-size:13px}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
[data-theme="pop"] .chip{border:2px solid #2b2433}
[data-theme="pop"] .chip[aria-pressed="true"]{background:#ffd84d;color:#2b2433;border-color:#2b2433}
.chips{display:flex;flex-wrap:wrap;gap:6px}

.track{position:relative;height:10px;border-radius:6px;background:var(--track);overflow:visible}
.track>.fill{position:absolute;inset:0 auto 0 0;border-radius:6px;background:var(--fill)}
.track>.fill.time{background:var(--time)}
[data-theme="pop"] .track{height:16px;border:2px solid #2b2433;border-radius:9px;overflow:hidden}
[data-theme="pop"] .track>.fill{border-radius:0;border-right:2px solid #2b2433}

.status{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px}
.dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--muted)}
.dot.good,.dot.done{background:var(--good)}.dot.warn{background:var(--warn)}.dot.bad{background:var(--bad)}
.badge{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;font-size:13px;font-weight:700;background:var(--surface-2);color:var(--ink)}
[data-theme="pop"] .badge{border:2px solid #2b2433;font-family:var(--font-display);font-weight:400;background:#ffd84d}

/* ===================== 진행 요약 ===================== */
.summary{background:var(--sum-bg);color:var(--sum-ink);border:var(--sum-border);display:flex;flex-direction:column;gap:12px}
[data-theme="library"] .summary{box-shadow:inset 0 0 0 4px #24412f,inset 0 0 0 5px #8f7a4c}
[data-theme="modern"] .summary{padding:22px}
.sum-top{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.sum-label{font-size:13px;color:var(--sum-muted)}
.sum-num{font-family:var(--font-num);font-weight:700;font-size:20px;line-height:1.1}
.sum-num b{font-size:44px;letter-spacing:-.02em}
[data-theme="library"] .sum-num b{font-weight:800}
.sum-pct{font-family:var(--font-num);font-weight:700;font-size:24px}
.summary .track{background:var(--sum-track)}
.summary .track>.fill{background:var(--sum-fill)}
.today{position:absolute;top:-5px;bottom:-5px;width:3px;margin-left:-1.5px;border-radius:2px;background:var(--sum-today)}
[data-theme="pop"] .today{top:0;bottom:0}
.today-lbl{position:relative;display:flex;justify-content:space-between;font-size:12px;color:var(--sum-muted);margin-top:-4px;min-height:1.5em}
.today-lbl .now{position:absolute;top:0;transform:translateX(-50%);white-space:nowrap;color:var(--sum-ink);font-weight:600}
.summary.compact{padding:14px 16px;gap:10px}
.summary.compact .sum-num b{font-size:32px}
.summary.compact .today-lbl{display:none}
.summary .status{color:var(--sum-ink)}
.summary .muted{color:var(--sum-muted)}

.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--surface);border:var(--card-border);box-shadow:var(--card-shadow);border-radius:var(--radius);padding:12px;display:flex;flex-direction:column;gap:3px;min-width:0}
.stat .k{font-size:12px;color:var(--muted)}
.stat .v{font-family:var(--font-num);font-weight:700;font-size:20px;line-height:1.2}
.stat .s{font-size:12px;color:var(--muted)}
.stat.hl{background:var(--accent);color:var(--accent-ink)}
.stat.hl .k,.stat.hl .s{color:inherit;opacity:.85}

/* ===================== 홈(빙고판) ===================== */
.home{display:flex;flex-direction:column;gap:18px}
.home-board{display:flex;flex-direction:column;gap:14px;min-width:0}
.home-side{display:flex;flex-direction:column;gap:16px;min-width:0}
@media (min-width:1024px){
  .home{display:grid;grid-template-columns:minmax(0,calc(100vh - 215px)) minmax(360px,1fr);gap:32px;align-items:start}
  .home-side{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:18px;align-content:start}
  .home-side .span-all{grid-column:1/-1}
}
.board-toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.size-group{display:flex;gap:8px}
.size-btn{min-height:44px;min-width:58px;padding:0 12px;display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:var(--btn-radius);border:var(--ghost-border);background:var(--ghost-bg);box-shadow:var(--ghost-shadow);font-family:var(--font-num);font-weight:700;font-size:15px;color:var(--ink)}
.size-btn small{font-family:var(--font-body);font-weight:400;font-size:12px;opacity:.8}
.size-btn[aria-pressed="true"]{background:var(--size-active-bg);color:var(--size-active-ink);border-color:var(--size-active-border)}
[data-theme="pop"] .size-btn[aria-pressed="true"]{transform:translateY(2px);box-shadow:0 1px 0 #2b2433}
[data-theme="modern"] .size-group{gap:2px;padding:3px;background:#e6e4de;border-radius:12px}
[data-theme="modern"] .size-btn{border:none;background:transparent;color:#5f636b;border-radius:9px;min-height:40px}
[data-theme="modern"] .size-btn[aria-pressed="true"]{background:#fff;color:#121417;box-shadow:0 1px 3px rgba(18,20,23,.14)}
@media (max-width:420px){.size-btn small{display:none}}
.bingo-count{display:flex;align-items:baseline;gap:6px;font-family:var(--font-num);font-size:15px;color:var(--accent-text)}
.bingo-count b{font-size:24px}
.bingo-count .lbl{font-family:var(--font-latin);font-style:var(--latin-style);font-size:14px;letter-spacing:.08em}
[data-theme="pop"] .bingo-count{transform:rotate(-4deg);background:#2b2433;color:#ffd84d;border-radius:12px;padding:4px 12px;font-weight:700}
[data-theme="pop"] .bingo-count b{font-size:20px}
[data-theme="modern"] .bingo-count{color:#8b8f96}
[data-theme="modern"] .bingo-count b{color:#3550e6}

.board-frame{background:var(--board-frame);padding:var(--board-pad);border-radius:var(--radius);box-shadow:var(--board-shadow)}
.board{position:relative;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:var(--gap,6px);container-type:inline-size}
.cell{position:relative;aspect-ratio:1/1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.35em;text-align:center;padding:7%;border-radius:var(--cell-radius);background:var(--cell-empty);color:var(--cell-empty-ink);border:var(--cell-empty-border);box-shadow:var(--cell-shadow);overflow:hidden;line-height:1.25;transition:transform .15s ease,filter .15s;font-family:var(--font-body)}
.cell:hover{transform:translateY(-2px);filter:brightness(1.03)}
.cell .m{font-size:clamp(10px,calc(100cqw / var(--n) * .135),19px);font-weight:700;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.cell .b{font-family:var(--font-display);font-weight:var(--display-weight);font-size:clamp(10.5px,calc(100cqw / var(--n) * .14),20px);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cell.is-filled{background:var(--cell-filled);color:var(--cell-filled-ink);border:var(--cell-filled-border)}
.cell.is-bingo{background:var(--cell-bingo);color:var(--cell-bingo-ink);border:var(--cell-bingo-border)}
.cell.is-filled .m,.cell.is-bingo .m{font-size:clamp(9px,calc(100cqw / var(--n) * .11),15px);font-weight:400;opacity:.85}
.cell.is-free{background:var(--cell-free);color:var(--cell-free-ink);border:var(--cell-free-border)}
.cell.is-free .m{font-family:var(--font-latin);font-style:var(--latin-style);font-weight:700;letter-spacing:.08em;font-size:clamp(13px,calc(100cqw / var(--n) * .2),28px)}
.cell .tick{position:absolute;top:5%;right:6%;width:clamp(10px,calc(100cqw / var(--n) * .14),18px);height:auto;opacity:.9}
[data-theme="modern"] .cell{align-items:flex-start;justify-content:space-between;text-align:left;padding:8%}
[data-theme="modern"] .cell.is-free{align-items:center;justify-content:center}
[data-theme="modern"] .cell .tick{display:none}
[data-theme="library"] .cell.is-filled .b,[data-theme="library"] .cell.is-bingo .b{color:#fff6e0}
.lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.lines line{stroke:var(--line-stroke);stroke-width:var(--line-w);stroke-linecap:round;opacity:.3}
.lines line.new{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw 1.8s .25s ease forwards}
@keyframes draw{0%{opacity:.95}40%{stroke-dashoffset:0;opacity:.95}100%{stroke-dashoffset:0;opacity:.3}}
@keyframes flash{0%{transform:scale(1)}35%{transform:scale(1.09);filter:brightness(1.3)}100%{transform:scale(1)}}
.cell.flash{animation:flash .6s ease both;animation-delay:var(--delay,0s);z-index:1}
.board-actions{display:flex;gap:8px}
.board-actions .btn.primary{flex:1}
.hint{font-size:13px;color:var(--muted)}

.book-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.book-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.book-row:first-child{border-top:none}
[data-theme="pop"] .book-row{border-top:2px dashed #e9d3b0}
.book-row .t{font-weight:700;font-family:var(--font-display)}
.book-row .meta{font-size:12.5px;color:var(--muted)}
.book-row .grow{flex:1;min-width:0}
.spine{width:8px;align-self:stretch;border-radius:2px;background:var(--accent);flex:none}
[data-theme="pop"] .spine{width:12px;border-radius:6px;border:2px solid #2b2433}

/* ===================== 책장 ===================== */
.shelf-tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.search{position:relative;flex:1 1 240px}
.search .ico{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search input{padding-left:40px}
.book-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.book-card{display:flex;gap:14px;text-align:left;width:100%;background:var(--surface);border:var(--card-border);box-shadow:var(--card-shadow);border-radius:var(--radius);padding:16px;color:var(--ink)}
.book-card:hover{transform:translateY(-2px)}
.book-card .cover{width:52px;height:72px;border-radius:3px;flex:none;display:flex;align-items:flex-end;justify-content:center;padding:6px 4px;font-family:var(--font-display);font-size:11px;line-height:1.2;color:#fff;text-align:center;overflow:hidden}
[data-theme="pop"] .book-card .cover{border:2px solid #2b2433;border-radius:8px;color:#2b2433}
.book-card .info{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1}
.book-card .t{font-family:var(--font-display);font-weight:var(--display-weight);font-size:16px;line-height:1.3}
.book-card .a{font-size:13px;color:var(--muted)}
.stars{color:var(--warn);letter-spacing:1px;font-size:13px}
[data-theme="library"] .stars{color:#8a5a14}
.tag{display:inline-flex;align-self:flex-start;align-items:center;min-height:24px;padding:0 8px;border-radius:999px;font-size:12px;background:var(--surface-2);color:var(--ink)}
.tag.on{background:var(--accent);color:var(--accent-ink)}
[data-theme="pop"] .tag{border:1.5px solid #2b2433}
[data-theme="pop"] .tag.on{background:#4fd1b0;color:#2b2433}
.empty{padding:40px 20px;text-align:center;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:12px}

/* ===================== 진행률 ===================== */
.prog-grid{display:grid;gap:16px}
@media (min-width:1024px){
  .prog-grid{grid-template-columns:repeat(12,minmax(0,1fr));gap:20px}
  .c4{grid-column:span 4}.c5{grid-column:span 5}.c7{grid-column:span 7}.c8{grid-column:span 8}.c12{grid-column:span 12}
}
.ring-card{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.ring{position:relative;width:150px;height:150px;flex:none}
.ring svg{width:100%;height:100%}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .c b{font-family:var(--font-num);font-size:36px;line-height:1}
.ring-info{display:flex;flex-direction:column;gap:8px;flex:1;min-width:170px}
.ring-info .big{font-family:var(--font-num);font-weight:700;font-size:34px;line-height:1.1}
.cmp{display:flex;flex-direction:column;gap:14px}
.cmp .lbl{display:flex;justify-content:space-between;font-size:14px;margin-bottom:6px}
.chart{width:100%;height:auto;display:block}
.bars{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:8px;align-items:end;height:180px}
.bar-col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%;font-size:12px;color:var(--muted)}
.bar-col i{display:block;width:100%;max-width:44px;background:var(--fill);border-radius:3px 3px 0 0}
.bar-col i.cur{background:var(--primary)}
.bar-col i.zero{height:3px!important;background:var(--line-strong);opacity:.5}
.balls{display:flex;flex-direction:column-reverse;align-items:center;gap:3px}
.balls i{width:22px;height:22px;border-radius:50%;border:2px solid #2b2433;display:block}
.month-axis{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:8px;border-top:1px solid var(--line-strong);padding-top:6px;margin-top:4px;font-size:12px;color:var(--muted);text-align:center;font-family:var(--font-num)}
[data-theme="pop"] .month-axis{border-top:2px solid #2b2433;color:#2b2433}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:14px}
.kv dt{color:var(--muted)}.kv dd{margin:0;text-align:right;font-family:var(--font-num);font-weight:700}
.bingo-banner{display:flex;align-items:center;gap:14px;background:var(--cell-bingo);color:var(--cell-bingo-ink);border:var(--cell-bingo-border);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--card-shadow)}
[data-theme="library"] .bingo-banner{box-shadow:none}
.bingo-banner .n{font-family:var(--font-num);font-weight:700;font-size:34px;line-height:1}

/* ===================== 설정 ===================== */
.settings-grid{display:grid;gap:16px}
@media (min-width:1024px){.settings-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}.settings-grid .wide{grid-column:1/-1}}
.theme-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.theme-card{display:flex;flex-direction:column;gap:10px;text-align:left;padding:14px;border-radius:12px;border:2px solid var(--line-strong);background:var(--surface);color:var(--ink)}
.theme-card[aria-pressed="true"],.theme-card:has(input:checked){border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 30%,transparent)}
.theme-card input{position:absolute;opacity:0;pointer-events:none}
.theme-card .pv{height:92px;border-radius:8px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px;padding:9px}
.theme-card .pv i{border-radius:3px;display:block}
.theme-card b{font-size:15px}
.theme-card small{font-size:12.5px;color:var(--muted);line-height:1.4}
.theme-card label{display:contents}
.data-actions{display:flex;flex-wrap:wrap;gap:10px}

/* ===================== 모달 ===================== */
.modal-back{position:fixed;inset:0;z-index:50;background:rgba(18,14,10,.5);display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.modal{position:relative;width:100%;max-height:92vh;overflow:auto;background:var(--surface);color:var(--ink);border:var(--card-border);border-radius:var(--radius) var(--radius) 0 0;padding:22px 18px calc(18px + env(safe-area-inset-bottom));animation:up .2s ease}
.modal h2{font-size:21px;margin:0 44px 14px 0}
[data-theme="library"] .modal h2{color:#24412f}
.modal-x{position:absolute;top:10px;right:10px}
.modal-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px;align-items:center}
.modal-actions .btn{flex:1 1 auto}
@media (min-width:720px){
  .modal-back{align-items:center;padding:24px}
  .modal{width:min(560px,100%);border-radius:var(--radius);padding:26px;box-shadow:0 24px 60px rgba(0,0,0,.25)}

  .modal.wide{width:min(980px,100%)}
}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(24px);opacity:0}}
.book-form{display:grid;gap:18px}
@media (min-width:860px){.book-form{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px}.book-form .form-actions{grid-column:1/-1}}
.bf-fields{display:flex;flex-direction:column;gap:12px}
.bf-place{display:flex;flex-direction:column;gap:10px}
.form-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.star-pick{display:flex;gap:2px}
.star-pick button{width:40px;height:44px;border:none;background:none;font-size:24px;color:var(--line-strong);padding:0}
.star-pick button.on{color:var(--warn)}
[data-theme="library"] .star-pick button.on{color:#8a5a14}
.mini-board{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:4px;container-type:inline-size}
.mini-cell{aspect-ratio:1/1;min-width:0;padding:3px;border-radius:calc(var(--cell-radius) * .7);border:var(--cell-empty-border);background:var(--cell-empty);color:var(--cell-empty-ink);font-size:clamp(9px,calc(100cqw / var(--n) * .12),13px);line-height:1.2;overflow:hidden;display:flex;align-items:center;justify-content:center;text-align:center}
.mini-cell.is-filled{background:var(--cell-filled);color:var(--cell-filled-ink);border:var(--cell-filled-border);opacity:.55}
.mini-cell.is-free{background:var(--cell-free);color:var(--cell-free-ink);border:var(--cell-free-border);opacity:.7}
.mini-cell.is-suggest{outline:2.5px dashed var(--accent);outline-offset:-5px}
[data-theme="pop"] .mini-cell.is-suggest{outline-color:#ff6b5b}
.mini-cell.is-sel{background:var(--cell-bingo);color:var(--cell-bingo-ink);border:var(--cell-bingo-border);outline:none;font-weight:700}
.sel-info{font-size:14px;min-height:1.4em}
.lib{display:flex;flex-direction:column;gap:12px;margin-top:14px;max-height:46vh;overflow:auto;padding-right:4px}

.share-pv{width:100%;max-width:340px;border-radius:8px;border:1px solid var(--line-strong);display:block;margin:0 auto}
.share-grid{display:grid;gap:18px}
@media (min-width:860px){.share-grid{grid-template-columns:340px minmax(0,1fr);gap:28px}}
.code{width:100%;min-height:76px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;padding:10px;border-radius:var(--radius-sm);border:var(--ghost-border);background:var(--surface-2);color:var(--ink);resize:none}

/* ===================== 온보딩 ===================== */

.size-cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.size-card{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 8px;border-radius:12px;border:2px solid var(--line-strong);background:var(--surface);cursor:pointer;text-align:center}
.size-card:has(input:checked){border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 30%,transparent)}
.size-card input{position:absolute;opacity:0}

@media (min-width:1024px){
  .onb{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}

@keyframes blink{50%{opacity:.3}}

.demo-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:10px 14px;margin-bottom:16px;border-radius:var(--radius-sm);background:var(--surface-2);border:1px dashed var(--line-strong);font-size:14px}

/* ===================== 빙고 보상 ===================== */
.reward-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.reward-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.reward-row:first-child{border-top:none}
.reward-row .grow{flex:1;min-width:0}
.reward-row .t{font-weight:700;font-family:var(--font-display);overflow-wrap:anywhere}
.reward-row .meta{display:flex;align-items:center;gap:4px;font-size:12.5px;color:var(--muted)}
.reward-row .meta .ico{width:15px;height:15px}
.reward-row.ready .meta{color:var(--accent-text);font-weight:700}

.rw-n{flex:none;width:44px;height:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:var(--cell-radius);background:var(--cell-empty);color:var(--cell-empty-ink);border:var(--cell-empty-border);font-family:var(--font-num);font-weight:700;font-size:18px;line-height:1}

.reward-row.ready .rw-n{background:var(--cell-bingo);color:var(--cell-bingo-ink);border:var(--cell-bingo-border)}
.reward-row.claimed .rw-n{background:var(--cell-filled);color:var(--cell-filled-ink);border:var(--cell-filled-border)}
.rw-ok{width:20px;height:20px;flex:none;color:var(--good)}
.rw-edit{display:flex;align-items:center;gap:6px;padding:8px 0;border-top:1px solid var(--line)}
.rw-edit:first-child{border-top:none}
.rw-edit .field select{width:auto}
.rw-edit .grow{flex:1 1 0;min-width:0}
.rw-edit .field select{padding-right:4px}
.rw-edit .tag{flex:none}
.rw-won{display:flex;flex-direction:column;gap:8px;width:100%}
.rw-won-item{display:flex;align-items:center;gap:12px;text-align:left;padding:12px 14px;border-radius:var(--radius-sm);background:var(--cell-bingo);color:var(--cell-bingo-ink);border:var(--cell-bingo-border)}
.rw-won-item small{display:block;font-size:12px;opacity:.9}
.rw-won-item b{font-family:var(--font-display);font-size:17px}

/* ===================== 앱 제목(빙고판으로 가기) ===================== */
.brand-link{display:block;padding:4px;margin:-4px;border:none;background:none;color:inherit;text-align:left;border-radius:var(--radius-sm);cursor:pointer;min-width:0}
.brand-link:hover{background:color-mix(in srgb,currentColor 8%,transparent)}

/* ===================== 판 관리 ===================== */
.board-list{display:grid;gap:16px}
@media (min-width:1024px){.board-list{grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:20px}}
.board-item{display:flex;gap:16px;align-items:flex-start}
.board-item .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.board-item.is-current{outline:3px solid color-mix(in srgb,var(--accent) 45%,transparent);outline-offset:2px}
.bi-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.bi-head h2{margin:0;font-size:17px;overflow-wrap:anywhere}
.board-item .meta{font-size:13px;color:var(--muted)}
.bi-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.mini-pv{flex:none;width:96px;gap:3px}
.mini-pv i{border-radius:2px}
@media (max-width:420px){.mini-pv{width:72px;gap:2px}}

/* ===================== 칸 끌어서 옮기기 ===================== */
.board .cell{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.cell.drag-src{opacity:.35}
.cell.drag-over{outline:3px solid var(--focus);outline-offset:2px;transform:scale(1.04)}
.cell.drag-ghost{position:absolute;z-index:5;pointer-events:none;transform:translate(-50%,-50%) rotate(-3deg) scale(1.08);box-shadow:0 16px 32px rgba(0,0,0,.28);opacity:.95;transition:none}
body.dragging,body.dragging *{cursor:grabbing!important}

/* ===================== 효과 ===================== */
#fx{position:fixed;inset:0;pointer-events:none;z-index:70}
.bingo-pop{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;z-index:65}
.bingo-pop span{font-family:var(--font-latin);font-style:var(--latin-style);font-weight:700;font-size:clamp(56px,11vw,150px);letter-spacing:.04em;padding:.05em .45em;border-radius:var(--radius);background:var(--cell-bingo);color:var(--cell-bingo-ink);border:var(--cell-bingo-border);box-shadow:0 18px 50px rgba(0,0,0,.25);animation:pop 1.7s ease forwards}
[data-theme="pop"] .bingo-pop span{border-width:4px;box-shadow:0 8px 0 #2b2433}
@keyframes pop{0%{transform:scale(.3) rotate(-10deg);opacity:0}18%{transform:scale(1.12) rotate(-4deg);opacity:1}30%{transform:scale(1) rotate(-4deg)}78%{opacity:1}100%{transform:scale(1.04) rotate(-4deg);opacity:0}}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:80;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:999px;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.2);max-width:calc(100vw - 32px);animation:up .2s ease}
@media (min-width:1024px){.toast{bottom:32px;left:calc(50% + 128px)}}
.no-motion *,.no-motion *::before,.no-motion *::after{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition:none!important}.lines line.new{stroke-dashoffset:0}}
@media print{.sidebar,.topbar,.tabbar{display:none}}

const SFX = {

function toRows(st) {

function fromRows(R) {

    boards: R.boards.slice().sort((a, c) => a.created_at.localeCompare(c.created_at)).map(b => ({ id: b.id, year: b.year, title: b.title, size: b.size, freeCenter: b.free_center, cells: cells[b.id] || [], completedLines: b.completed_lines, createdAt: b.created_at, archived: b.archived })),

function reid(st, all) { // 새 ID를 발급하고(all=false면 UUID가 아닌 옛 ID만) 책·칸·빙고판 연결을 맞춰요.
  const need = id => all || !isUUID(id), bm = {}, pm = {};

  const ids = new Set(st.books.map(b => b.id));
  st.boards.forEach(b => { if (need(b.id)) { pm[b.id] = uid(); b.id = pm[b.id]; } b.cells.forEach(c => { if (c.bookId) c.bookId = bm[c.bookId] || (ids.has(c.bookId) ? c.bookId : null); }); });
  if (pm[st.activeBoardId]) st.activeBoardId = pm[st.activeBoardId];

function diffRows(prev, next) {

    const before = new Map(((prev && prev[t]) || []).map(r => [PK[t](r), JSON.stringify(r)]));
    const keys = new Set(next[t].map(PK[t]));
    d[t] = { up: next[t].filter(r => before.get(PK[t](r)) !== JSON.stringify(r)), del: DEL_COL[t] ? [...before.keys()].filter(k => !keys.has(k)) : [] };

}

  const now = new Date().toISOString(), ok = r => { if (r.error) throw r.error; };
  for (const t of ['books', 'boards', 'board_cells', 'rewards', 'goals', 'settings']) if (d[t].up.length) ok(await sb.from(t).upsert(d[t].up.map(r => Object.assign({ updated_at: now }, r)), { onConflict: ON_CONFLICT[t] }));

}

async function runSync() { // 마지막으로 서버에 저장된 행과 지금 상태의 차이만 올려요. 실패하면 다음에 같은 차이를 다시 보내요.

function coverColor(s) { const pal = { library: ['#24412f', '#6e2230', '#5a3d26', '#2f4a5a', '#7a5a1f'], pop: ['#ff6b5b', '#ffd84d', '#4fd1b0', '#b9a3ff', '#7cc4ff'], modern: ['#121417', '#3550e6', '#5f636b', '#2c6e5a', '#8a4b00'] }[S.profile.theme]; let h = 0; for (const ch of s) h = (h * 31 + ch.charCodeAt(0)) >>> 0; return pal[h % pal.length]; }
function cellOf(bookId) { const b = board(); return b ? b.cells.findIndex(c => c.bookId === bookId) : -1; }

      <p class="hint">칸을 누르면 책을 놓거나 미션을 바꿀 수 있어요. 끌어서(휴대폰은 길게 누른 뒤) 칸 위치를 바꿔요 · ${filled}/${fillable}칸 채움</p>

      ${unplaced.length ? `<section class="card"><div class="card-head"><h2>칸에 놓지 않은 책</h2><span class="muted num">${unplaced.length}권</span></div><ul class="book-list">${unplaced.slice(0, 4).map(x => `<li class="book-row"><span class="spine" style="background:${coverColor(x.title)}"></span><div class="grow"><div class="t">${esc(x.title)}</div><div class="meta">${esc(x.author || '')} · ${fmtDate(x.finishedAt)}</div></div><button class="btn sm" data-act="edit-book" data-id="${x.id}">칸에 놓기</button></li>`).join('')}</ul></section>` : ''}
      <section class="card"><div class="card-head"><h2>최근 읽은 책</h2><button class="btn sm" data-act="go" data-route="shelf">책장 보기</button></div>

function rewardCardHTML(b) {
  const list = rewardsOf(b.year);
  return `<section class="card" aria-label="빙고 보상"><div class="card-head"><h2>빙고 보상</h2><button class="btn sm" data-act="rewards">${ic(list.length ? 'edit' : 'gift')}${list.length ? '보상 설정' : '보상 정하기'}</button></div>
    ${list.length ? `<ul class="reward-list">${list.map(r => { const s = rewardState(r, b); return `<li class="reward-row ${s.k}"><span class="rw-n" aria-label="빙고 ${r.lines}줄">${r.lines}<small>줄</small></span><div class="grow"><div class="t">${esc(r.title)}</div><div class="meta">${s.k === 'ready' ? ic('gift') : ''}${esc(s.txt)}</div></div>${s.k === 'ready' ? `<button class="btn sm primary" data-act="claim" data-id="${r.id}">받았어요</button>` : s.k === 'claimed' ? ic('check', 'rw-ok') : ''}</li>`; }).join('')}</ul>`
    : '<p class="muted" style="font-size:14px">빙고 줄을 완성할 때마다 나에게 줄 보상을 정해 보세요. 예: 1줄 — 좋아하는 디저트 사 먹기, 3줄 — 여행 가기</p>'}
  </section>`;
}
function drawLines() {
  const svg = $('#lines'), bd = $('#board'); if (!svg || !bd) return;
  const b = board(), W = bd.clientWidth, H = bd.clientHeight;
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  const cellsEl = $$('.cell', bd);
  const center = i => { const el = cellsEl[i]; return [el.offsetLeft + el.offsetWidth / 2, el.offsetTop + el.offsetHeight / 2]; };
  const ext = 0.28;
  svg.innerHTML = getLines(b.size).filter(l => b.completedLines.includes(l.id)).map(l => {
    const [x1, y1] = center(l.cells[0]), [x2, y2] = center(l.cells[l.cells.length - 1]);
    const dx = (x2 - x1) / (b.size - 1) * ext, dy = (y2 - y1) / (b.size - 1) * ext;
    const len = Math.hypot(x2 - x1 + 2 * dx, y2 - y1 + 2 * dy).toFixed(0);
    const isNew = pendingNew.includes(l.id) && motionOn();
    return `<line class="${isNew ? 'new' : ''}" style="--len:${len}" x1="${(x1 - dx).toFixed(1)}" y1="${(y1 - dy).toFixed(1)}" x2="${(x2 + dx).toFixed(1)}" y2="${(y2 + dy).toFixed(1)}"/>`;
  }).join('');
}

/* ---------------- 뷰: 책장 ---------------- */

/* ---------------- 뷰: 진행률 ---------------- */
function chartHTML() {
  const counts = monthly(), t = today0(), y = parse(goal().start).getFullYear();
  const curM = t.getFullYear() === y ? t.getMonth() : (t.getFullYear() > y ? 11 : -1);
  const th = S.profile.theme, max = Math.max(3, ...counts);
  const axis = `<div class="month-axis">${counts.map((_, i) => `<span>${i + 1}</span>`).join('')}</div>`;
  const label = `월별 완독: ${counts.map((n, i) => (i + 1) + '월 ' + n + '권').join(', ')}`;
  if (th === 'modern') {
    const W = 640, H = 220, L = 26, R = 14, T = 16, B = 18, g = goal().targetBooks;
    const top = Math.max(g, counts.reduce((a, c) => a + c, 0));
    const x = i => L + i * (W - L - R) / 11, yy = v => H - B - v / top * (H - T - B);
    let sum = 0; const pts = []; counts.forEach((n, i) => { if (i <= curM) { sum += n; pts.push([x(i), yy(sum)]); } });
    const line = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
    const area = pts.length ? line + ` L${pts[pts.length - 1][0].toFixed(1)} ${H - B} L${pts[0][0].toFixed(1)} ${H - B} Z` : '';
    const last = pts[pts.length - 1];
    const grid = [0, .5, 1].map(f => `<line x1="${L}" x2="${W - R}" y1="${yy(top * f)}" y2="${yy(top * f)}" stroke="#eceae4"/><text x="${L - 8}" y="${yy(top * f) + 4}" text-anchor="end" font-size="11" fill="#5f636b" font-family="Inter Tight">${Math.round(top * f)}</text>`).join('');
    return `<div class="card-head"><h2>누적 완독 추이</h2><div class="legend"><span><i style="width:14px;height:2.5px;background:#121417;display:inline-block"></i>실제</span><span><i style="width:14px;border-top:2px dashed #3550e6;display:inline-block"></i>목표 페이스</span></div></div>
      <svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}">${grid}<line x1="${x(0)}" y1="${yy(g / 12)}" x2="${x(11)}" y2="${yy(g)}" stroke="#3550e6" stroke-width="2" stroke-dasharray="6 5"/>${area ? `<path d="${area}" fill="#121417" fill-opacity=".06"/><path d="${line}" fill="none" stroke="#121417" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>` : ''}${last ? `<circle cx="${last[0]}" cy="${last[1]}" r="5.5" fill="#fff" stroke="#121417" stroke-width="2.5"/><text x="${last[0]}" y="${last[1] - 12}" text-anchor="middle" font-family="Inter Tight" font-weight="700" font-size="14" fill="#121417">${sum}</text>` : ''}</svg>
      <div class="month-axis" style="border:none;padding-left:${L / W * 100}%;padding-right:${R / W * 100}%;gap:0">${counts.map((_, i) => `<span>${i + 1}</span>`).join('')}</div>`;
  }
  if (th === 'pop') {
    const colors = ['#ff6b5b', '#ffd84d', '#4fd1b0', '#b9a3ff'];
    return `<div class="card-head"><h2>월별 완독</h2><span class="muted">공 하나가 책 한 권</span></div>
      <div class="bars" role="img" aria-label="${esc(label)}">${counts.map((n, i) => `<div class="bar-col">${i <= curM || n ? `<div class="balls">${Array.from({ length: Math.min(n, 6) }, () => `<i style="background:${colors[i % 4]}"></i>`).join('')}</div>${n > 6 ? `<span>+${n - 6}</span>` : ''}` : '<i class="zero"></i>'}</div>`).join('')}</div>${axis}`;
  }
  return `<div class="card-head"><h2>월별 완독</h2><span class="muted">월평균 ${(counts.reduce((a, c) => a + c, 0) / Math.max(1, curM + 1)).toFixed(1)}권</span></div>
    <div class="bars" role="img" aria-label="${esc(label)}">${counts.map((n, i) => `<div class="bar-col"><span>${n || ''}</span><i class="${n ? (i === curM ? 'cur' : '') : 'zero'}" style="height:${n / max * 140}px"></i></div>`).join('')}</div>${axis}`;
}
function viewProgress() {

    if (!sb) { err.textContent = '인터넷에 연결되면 로그인할 수 있어요. 연결한 뒤 새로고침해 주세요.'; return; }
    btn.disabled = true; btn.textContent = '로그인하는 중…'; err.textContent = '';

  f.addEventListener('submit', e => {
    e.preventDefault();
    const o = { nickname: f.nickname.value.trim(), target: Math.max(1, +f.target.value || 20), theme: f.querySelector('[name=onb-theme]:checked').value, size: +f.querySelector('[name=size]:checked').value, free: f.free.checked };
    if (!S) S = newState(o);
    else { // 책·보상 기록은 그대로 두고 새 판을 지금 쓰는 판으로 만들어요. 이전 판은 판 관리에 보관돼요.
      const free = o.size % 2 === 1 && o.free, nb = makeBoard(o.size, free, recommend(o.size, free), f.title ? f.title.value.trim() : '');
      Object.assign(S.profile, { nickname: o.nickname, theme: o.theme }); goal().targetBooks = o.target;

  $('#onb-cancel')?.addEventListener('click', () => { document.documentElement.dataset.theme = S.profile.theme; goBack(); });
}

/* ---------------- 뷰: 판 관리 ---------------- */
function viewBoards() {
  const cur = board();
  const list = S.boards.slice().sort((a, c) => (c.id === cur.id) - (a.id === cur.id) || String(c.createdAt || '').localeCompare(String(a.createdAt || '')));
  return `<div class="page-head"><div><p class="eyebrow">My Boards</p><h1>빙고판 관리</h1></div><div class="head-actions"><button class="btn primary" data-act="go" data-route="new">${ic('plus')}새 빙고판 만들기</button></div></div>
  <p class="muted" style="margin-bottom:16px;font-size:14px">지금 쓰는 판은 하나예요. 다른 판으로 바꾸거나 필요 없는 판을 삭제할 수 있어요. 판을 삭제해도 읽은 책은 책장에 그대로 남아요.</p>
  <div class="board-list">${list.map(b => {
    const isCur = b.id === cur.id, filled = b.cells.filter(c => c.bookId).length, fillable = b.cells.filter(c => !c.free).length;
    const lineSet = new Set(); getLines(b.size).filter(l => b.completedLines.includes(l.id)).forEach(l => l.cells.forEach(i => lineSet.add(i)));
    const pv = b.cells.map((c, i) => `<i class="${c.free ? 'x' : lineSet.has(i) ? 'b' : c.bookId ? 'f' : ''}"></i>`).join('');
    return `<article class="card board-item ${isCur ? 'is-current' : ''}" aria-label="${esc(b.title)}${isCur ? ', 지금 쓰는 판' : ''}">
      <div class="demo mini-pv" style="grid-template-columns:repeat(${b.size},minmax(0,1fr))" aria-hidden="true">${pv}</div>
      <div class="grow">
        <div class="bi-head"><h2>${esc(b.title)}</h2>${isCur ? '<span class="tag on">지금 쓰는 판</span>' : ''}</div>
        <p class="meta">${b.year}년 · ${b.size}×${b.size} · 빙고 ${b.completedLines.length}/${maxLines(b)}줄 · ${filled}/${fillable}칸 채움${b.createdAt ? ' · ' + fmtDate(ymd(new Date(b.createdAt))) + ' 만듦' : ''}</p>
        <div class="bi-actions">${isCur ? `<button class="btn sm" data-act="go" data-route="home">${ic('grid')}빙고판 보기</button>` : `<button class="btn sm primary" data-act="use-board" data-id="${b.id}">이 판 쓰기</button>`}<button class="btn sm danger" data-act="del-board" data-id="${b.id}">${ic('trash')}삭제</button></div>
      </div></article>`;
  }).join('')}</div>`;
}
function useBoard(id) {
  const nb = S.boards.find(x => x.id === id); if (!nb) return;
  S.boards.forEach(x => x.archived = x.id !== id); S.activeBoardId = id; save(); go('home'); toast(`「${nb.title}」 판으로 바꿨어요.`);
}
function deleteBoard(id) {
  const b = S.boards.find(x => x.id === id); if (!b) return;
  const placed = b.cells.filter(c => c.bookId).length, isCur = b.id === board().id;
  confirmModal('빙고판을 삭제할까요?', `「${esc(b.title)}」 판을 삭제하면 되돌릴 수 없어요.${placed ? ` 칸에 놓인 책 ${placed}권은 책장에 그대로 남고 미배치 책이 돼요.` : ''}${isCur ? (S.boards.length > 1 ? ' 지금 쓰는 판이라 가장 최근에 만든 다른 판으로 바꿔요.' : ' 마지막 판이라 삭제하면 새 빙고판 만들기 화면으로 가요.') : ''}`, [
    { label: '취소' },
    { label: '삭제', danger: true, run() {
      S.boards = S.boards.filter(x => x.id !== id);
      if (isCur) { const next = S.boards.slice().sort((a, c) => String(c.createdAt || '').localeCompare(String(a.createdAt || '')))[0]; S.boards.forEach(x => x.archived = !next || x.id !== next.id); S.activeBoardId = next ? next.id : null; }
      save(); render(); toast('빙고판을 삭제했어요.');
    } }
  ]);
}

/* ---------------- 렌더 ---------------- */

    app.innerHTML = viewOnboarding(); mountOnboarding(); return;

  document.documentElement.classList.toggle('no-motion', !S.profile.motion);
  const p = pace();
  const views = { home: viewHome, shelf: viewShelf, progress: viewProgress, boards: viewBoards, settings: viewSettings };
  if (!views[route]) route = 'home';
  const scrollY = window.scrollY;
  app.innerHTML = `<div class="shell">

function shuffleMissions() {
  const b = board(); const keep = b.cells.filter(c => c.bookId || c.free).map(c => c.mission);
  const empties = b.cells.filter(c => !c.bookId && !c.free);
  const fresh = recommend(b.size, false, [], keep).slice(0, empties.length);
  empties.forEach((c, k) => c.mission = fresh[k] || c.mission);
  save(); render(); toast('빈 칸의 미션을 새로 섞었어요.');
}

/* ---------------- 크기 변경 ---------------- */
function changeSize(n) {
  const b = board(); if (n === b.size) return;
  const placed = b.cells.filter(c => c.bookId);
  const free = n % 2 ? (b.size % 2 ? b.freeCenter : n === 5) : false;
  const make = (move) => {
    const keep = move ? placed.map(c => c.mission) : [];
    const nb = makeBoard(n, free, recommend(n, free, keep), b.title);
    let lost = 0;
    if (move) placed.forEach(c => { const t = nb.cells.find(x => !x.free && !x.bookId && x.mission === c.mission); if (t) t.bookId = c.bookId; else lost++; });
    checkBingo(nb);
    if (placed.length) b.archived = true; else S.boards = S.boards.filter(x => x.id !== b.id);
    S.boards.push(nb); S.activeBoardId = nb.id; save(); render();
    toast(`${n}×${n} 빙고판으로 바꿨어요.` + (lost ? ` 칸이 모자라 ${lost}권은 미배치로 옮겼어요.` : ''));
  };
  if (!placed.length) { make(false); return; }
  confirmModal(`${n}×${n} 빙고판으로 바꿀까요?`, `지금 빙고판에 책 ${placed.length}권이 놓여 있어요. 지금 판은 보관함에 남아요.<br><b>책 옮기기</b>: 놓인 책과 미션을 새 판으로 가져가요.${n * n - (free ? 1 : 0) < placed.length ? ' 칸이 모자라면 일부는 미배치로 옮겨져요.' : ''}<br><b>새 판으로 시작</b>: 빈 빙고판으로 시작해요. 책은 책장에 그대로 있어요.`, [
    { label: '취소' }, { label: '새 판으로 시작', run: () => make(false) }, { label: '책 옮기기', primary: true, run: () => make(true) }
  ]);
}

function wrapText(ctx, text, maxW, maxLines) {

}

/* ---------------- 이벤트 ---------------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || !S && el.dataset.act !== 'close') return;
  const a = el.dataset.act;
  if (a === 'close') return closeModal();
  if (a === 'go') return go(el.dataset.route);
  if (a === 'cell') return openCell(+el.dataset.idx);
  if (a === 'size') return changeSize(+el.dataset.size);
  if (a === 'add-book') return openBookForm(null);
  if (a === 'edit-book') return openBookForm(S.books.find(x => x.id === el.dataset.id));
  if (a === 'shuffle') return shuffleMissions();
  if (a === 'share') { closeModal(true); return openShare(); }
  if (a === 'goal') return go('settings');
  if (a === 'theme') { S.profile.theme = el.dataset.theme; save(); render(); return toast(THEMES[el.dataset.theme].name + ' 테마로 바꿨어요.'); }
  if (a === 'shelf-f') { shelfFilter.f = el.dataset.f; return render(); }
  if (a === 'use-board') return useBoard(el.dataset.id);
  if (a === 'del-board') return deleteBoard(el.dataset.id);
  if (a === 'rewards') return openRewards();
  if (a === 'claim') return claimReward(el.dataset.id);
  if (a === 'logout') return logout();
  if (a === 'exit-demo') return exitDemo();
  if (a === 'export') return exportBackup();
  if (a === 'import') return $('#import-file').click();
  if (a === 'reset') return confirmModal('모든 기록을 지울까요?', `책 기록, 빙고판, 목표, 보상이 ${demo ? '' : '내 계정에서도 '}모두 지워지고 되돌릴 수 없어요. 먼저 백업을 내려받는 것을 권해요.`, [{ label: '취소' }, { label: '계속', danger: true, run() {
    confirmModal('정말 초기화할까요?', '마지막 확인이에요. 초기화하면 처음 화면으로 돌아가요.', [{ label: '취소' }, { label: '전체 초기화', danger: true, run() { const th = S.profile.theme; S = null; if (demo) demo = false; else { lsSet(KEY, null); runSync(); } document.documentElement.dataset.theme = th; try { history.replaceState(null, '', location.pathname); } catch (e) { } render(); } }]); } }]);
});
let resizeT; window.addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(drawLines, 120); });
window.addEventListener('hashchange', () => { const r = location.hash.slice(1) || 'home'; if (S && r !== route) { closeModal(true); route = r; window.scrollTo(0, 0); render(); } });

/* ---------------- 시작 ---------------- */
async function boot() {
  S = DEMO_MODE ? sampleState(FORCE_THEME || DEFAULT_THEME) : load();
  if (S && FORCE_THEME) S.profile.theme = FORCE_THEME;
  document.documentElement.dataset.theme = S ? S.profile.theme : (FORCE_THEME || DEFAULT_THEME);
  route = DEMO_MODE ? DEMO_ROUTE : (location.hash.slice(1) || 'home');
  if (DEMO_MODE) return render();
  const owner = lsGet(KEY_OWNER);
  if (owner) { user = owner; syncState = navigator.onLine ? 'saving' : 'offline'; } // 마지막 캐시를 먼저 보여 줘요.
  render();
  if (!window.supabase) { if (owner) setSync('offline'); else { loginNote = '인터넷에 연결되면 로그인할 수 있어요.'; render(); } return; }
  sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { db: { schema: 'read_a_line' }, auth: { storageKey: 'read-a-line-auth', persistSession: true, autoRefreshToken: true } });
  sb.auth.onAuthStateChange(ev => { if (ev === 'SIGNED_OUT' && user) { user = null; setSync('idle'); closeModal(true); render(); } }); // 세션이 끝나면 로그인 화면으로(캐시는 남겨 다시 로그인하면 이어서 저장)
  let session = null;
  try { session = (await sb.auth.getSession()).data.session; } catch (e) { }
  if (demo) return; // 세션을 확인하는 동안 둘러보기를 시작했다면 그대로 둘러보기를 이어 가요.
  if (session) await afterLogin(session.user);
  else if (owner && !navigator.onLine) setSync('offline'); // 오프라인이면 캐시로 계속 써요.
  else { user = null; setSync('idle'); render(); }
}
boot();
</script>
